<img
        {% if class %}class="{{ class }}"{% endif %}
        alt="{{ alt }}"
        loading="{{ loading }}"
        decoding="async"
        {% if fetchpriority %}fetchpriority="{{ fetchpriority }}"{% endif %}
        {% if width and height %}width="{{ width }}" height="{{ height }}"{% endif %}
        src="{{ src }}"
        srcset="{{ srcset }}"
        sizes="{{ sizes }}"
/>
